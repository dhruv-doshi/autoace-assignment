[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autoace-call-analysis"
version = "0.1.0"
description = "Experiment-first production call audio analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "jsonschema>=4.23,<5",
  "psutil>=5.9,<7",
  "soundfile>=0.12,<1",
  "streamlit>=1.40,<2",
  "faster-whisper>=1.1,<2",
  # Streamlit's Starlette server currently relies on Uvicorn internals that
  # changed in 0.52. Keep the compatible range explicit for reproducible runs.
  "uvicorn>=0.30,<0.52"
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100,<7",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["autoace"]

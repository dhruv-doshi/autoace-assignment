# Replace the app name with a globally unique name before first deployment.
app = "autoace-call-analysis"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  AUTOACE_OPENROUTER_BUDGET_USD = "0.10"
  AUTOACE_MAX_FILES_PER_RUN = "25"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 1
    hard_limit = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048
